<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Invoice {{ invoice.invoice_number }}</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --sage-ink:        #0B1E2D;
    --sage-teal:       #1B998B;
    --sage-green:      #2E7D55;
    --sage-red:        #B83A26;
    --surface:         #FFFFFF;
    --surface-warm:    #FBFBF7;
    --line:            #DCDFD7;
    --line-soft:       #E8EAE3;
    --text:            #0B1E2D;
    --text-2:          #3D4D58;
    --text-3:          #6E7A82;
    --display:         'Fraunces', 'Times New Roman', serif;
    --body:            'Geist', system-ui, -apple-system, sans-serif;
    --mono:            'Geist Mono', ui-monospace, monospace;
    --radius-lg:       14px;
  }

  @page { size: A4; margin: 16mm; }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #fff;
    color: var(--text);
    font-family: var(--body);
    font-size: 14px;
    line-height: 1.5;
    -weasy-hyphens: none;
  }
  .mono { font-family: var(--mono); }
  .num  { font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }

  /* Invoice document styles — copied from base.html so the PDF matches the page */
  .invoice { background: var(--surface); padding: 0; max-width: none; border: none; border-radius: 0; }
  .inv-header { display: flex; justify-content: space-between; align-items: flex-start; padding-bottom: 24px; border-bottom: 2px solid var(--sage-ink); margin-bottom: 24px; }
  .inv-brand-mark { font-family: var(--display); font-size: 28px; font-weight: 600; letter-spacing: -0.04em; color: var(--sage-ink); }
  .inv-brand-mark .dot { color: var(--sage-teal); }
  .inv-meta-row { text-align: right; font-size: 12px; color: var(--text-2); line-height: 1.7; }
  .inv-num { font-family: var(--mono); font-size: 16px; color: var(--sage-ink); font-weight: 500; }
  .inv-section-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.16em; color: var(--text-3); margin-bottom: 4px; font-weight: 500; }
  .inv-bill-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; margin-bottom: 28px; }

  tr, .inv-header { page-break-inside: avoid; }
</style>
</head>
<body>
{% include "billing/_invoice_document.html" %}
</body>
</html>
